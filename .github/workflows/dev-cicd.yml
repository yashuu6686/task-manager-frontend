name: Dev CI/CD Pipeline

# This workflow runs ONLY for the dev environment (branch: dev)
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-dev

jobs:
  lint-and-test:
    name: Lint & Quality Checks (Dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  docker-build:
    name: Docker Build & Verification (Dev)
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,format=short,prefix=dev-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to Dev Server
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via Docker Compose (Dev Server)
        # Uncomment and configure with your Dev Server SSH Secrets if deploying to a remote host:
        # uses: appleboy/ssh-action@v1.0.3
        # with:
        #   host: ${{ secrets.DEV_SERVER_HOST }}
        #   username: ${{ secrets.DEV_SERVER_USER }}
        #   key: ${{ secrets.DEV_SERVER_SSH_KEY }}
        #   script: |
        #     cd /path/to/dev/task-management-app/frontend
        #     git pull origin dev
        #     docker-compose -f docker-compose.dev.yml down
        #     docker-compose -f docker-compose.dev.yml up -d --build
        run: |
          echo "Dev container image verified and built successfully for branch: dev"
          echo "Target image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev"
