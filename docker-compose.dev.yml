version: '3.8'

services:
  frontend:
    container_name: dev-frontend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3000
    networks:
      - dev-network
    expose:
      - "3000"

  nginx:
    container_name: dev-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
